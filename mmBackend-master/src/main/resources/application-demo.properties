# Disposable local demonstration database. Resets each time the application starts.
spring.datasource.url=jdbc:h2:mem:masterpiecemart;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
